<svg width="680" viewBox="0 0 680 1420" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
  <title>Flujo de navegación · Los Logos App</title>

  <!-- Fondo -->
  <rect width="680" height="1420" fill="#F6F2EC"/>

  <!-- HEADER -->
  <text x="340" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#1A1816">Flujo de navegación · Los Logos App</text>

  <!-- LANE BG -->
  <rect x="20" y="48" width="310" height="1350" rx="10" fill="#EDE7DE" opacity="0.6"/>
  <rect x="350" y="48" width="310" height="1350" rx="10" fill="#E8E2D4" opacity="0.4"/>
  <line x1="335" y1="48" x2="335" y2="1398" stroke="#1A1816" stroke-width="0.7" stroke-dasharray="4 4" opacity="0.3"/>

  <!-- LANE HEADERS -->
  <text x="175" y="72" text-anchor="middle" font-size="14" font-weight="600" fill="#1A1816">👤 Administrador</text>
  <text x="175" y="88" text-anchor="middle" font-size="12" fill="#5F5E5A">Vendedor de logos</text>
  <text x="505" y="72" text-anchor="middle" font-size="14" font-weight="600" fill="#1A1816">🏪 Usuario final</text>
  <text x="505" y="88" text-anchor="middle" font-size="12" fill="#5F5E5A">Dueño del negocio</text>

  <!-- ARROW MARKER -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#3B6D11" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#A32D2D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- 01 ONBOARDING -->
  <rect x="60" y="108" width="230" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.7"/>
  <text x="175" y="131" text-anchor="middle" font-size="13" font-weight="600" fill="#3C3489">01 · Onboarding</text>
  <text x="175" y="149" text-anchor="middle" font-size="11" fill="#534AB7">Registro, permisos, teléfono</text>
  <line x1="175" y1="160" x2="175" y2="190" stroke="#534AB7" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- 02 CÁMARA -->
  <rect x="60" y="192" width="230" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.7"/>
  <text x="175" y="215" text-anchor="middle" font-size="13" font-weight="600" fill="#3C3489">02 · Cámara</text>
  <text x="175" y="233" text-anchor="middle" font-size="11" fill="#534AB7">Apunta a fachada del negocio</text>
  <line x1="175" y1="244" x2="175" y2="274" stroke="#534AB7" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- 03 CAPTURA -->
  <rect x="60" y="276" width="230" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.7"/>
  <text x="175" y="299" text-anchor="middle" font-size="13" font-weight="600" fill="#3C3489">03 · Formulario de captura</text>
  <text x="175" y="317" text-anchor="middle" font-size="11" fill="#534AB7">Nombre, categoría, WhatsApp</text>
  <line x1="175" y1="328" x2="175" y2="358" stroke="#534AB7" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- 04 GENERANDO IA -->
  <rect x="60" y="360" width="230" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.7"/>
  <text x="175" y="383" text-anchor="middle" font-size="13" font-weight="600" fill="#085041">04 · Generando con IA</text>
  <text x="175" y="401" text-anchor="middle" font-size="11" fill="#0F6E56">3 propuestas de logo / identidad</text>
  <line x1="175" y1="412" x2="175" y2="442" stroke="#0F6E56" stroke-width="1.2" marker-end="url(#arr-teal)"/>

  <!-- 05 LISTA DE LEADS -->
  <rect x="60" y="444" width="230" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.7"/>
  <text x="175" y="467" text-anchor="middle" font-size="13" font-weight="600" fill="#3C3489">05 · Lista de leads</text>
  <text x="175" y="485" text-anchor="middle" font-size="11" fill="#534AB7">Ver todos los negocios capturados</text>
  <line x1="175" y1="496" x2="175" y2="526" stroke="#534AB7" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- 06 DETALLE DEL LEAD -->
  <rect x="60" y="528" width="230" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.7"/>
  <text x="175" y="551" text-anchor="middle" font-size="13" font-weight="600" fill="#3C3489">06 · Detalle del lead</text>
  <text x="175" y="569" text-anchor="middle" font-size="11" fill="#534AB7">Ver propuestas, cambiar status</text>

  <!-- fork labels -->
  <text x="103" y="603" text-anchor="middle" font-size="11" fill="#5F5E5A">WhatsApp</text>
  <line x1="120" y1="580" x2="120" y2="638" stroke="#534AB7" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="250" y="603" text-anchor="middle" font-size="11" fill="#5F5E5A">Landing</text>
  <line x1="230" y1="580" x2="230" y2="638" stroke="#0F6E56" stroke-width="1.2" marker-end="url(#arr-teal)"/>

  <!-- 07 WHATSAPP -->
  <rect x="40" y="640" width="140" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.7"/>
  <text x="110" y="663" text-anchor="middle" font-size="13" font-weight="600" fill="#3C3489">07 · WhatsApp</text>
  <text x="110" y="681" text-anchor="middle" font-size="11" fill="#534AB7">Preview y envío</text>

  <!-- 08 LANDING -->
  <rect x="200" y="640" width="120" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.7"/>
  <text x="260" y="663" text-anchor="middle" font-size="13" font-weight="600" fill="#085041">08 · Landing</text>
  <text x="260" y="681" text-anchor="middle" font-size="11" fill="#0F6E56">Genera URL pública</text>

  <!-- CROSS ARROWS to user lane -->
  <path d="M180 666 L380 666" fill="none" stroke="#534AB7" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arr)"/>
  <text x="280" y="658" text-anchor="middle" font-size="10" fill="#5F5E5A">mensaje WA</text>
  <path d="M320 690 L380 750" fill="none" stroke="#0F6E56" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arr-teal)"/>
  <text x="368" y="724" text-anchor="start" font-size="10" fill="#5F5E5A">URL</text>

  <!-- USER LANE -->
  <!-- U1 Recibe WA -->
  <rect x="380" y="640" width="250" height="52" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.7"/>
  <text x="505" y="663" text-anchor="middle" font-size="13" font-weight="600" fill="#633806">Recibe mensaje WhatsApp</text>
  <text x="505" y="681" text-anchor="middle" font-size="11" fill="#854F0B">Con propuestas de logo adjuntas</text>
  <line x1="505" y1="692" x2="505" y2="722" stroke="#BA7517" stroke-width="1.2" marker-end="url(#arr-amber)"/>

  <!-- U2 Revisa -->
  <rect x="380" y="724" width="250" height="52" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.7"/>
  <text x="505" y="747" text-anchor="middle" font-size="13" font-weight="600" fill="#633806">Revisa propuestas de logo</text>
  <text x="505" y="765" text-anchor="middle" font-size="11" fill="#854F0B">Editorial, Sello, Moderno</text>
  <line x1="505" y1="776" x2="505" y2="806" stroke="#BA7517" stroke-width="1.2" marker-end="url(#arr-amber)"/>

  <!-- U3 Landing -->
  <rect x="380" y="808" width="250" height="52" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.7"/>
  <text x="505" y="831" text-anchor="middle" font-size="13" font-weight="600" fill="#633806">Visita landing pública</text>
  <text x="505" y="849" text-anchor="middle" font-size="11" fill="#854F0B">Ve su negocio presentado</text>
  <line x1="505" y1="860" x2="505" y2="890" stroke="#BA7517" stroke-width="1.2" marker-end="url(#arr-amber)"/>

  <!-- DECISION DIAMOND -->
  <polygon points="505,892 558,924 505,956 452,924" fill="#FFF8EC" stroke="#BA7517" stroke-width="1"/>
  <text x="505" y="928" text-anchor="middle" font-size="12" font-weight="600" fill="#633806">¿Le interesa?</text>

  <!-- No branch -->
  <line x1="452" y1="924" x2="388" y2="924" stroke="#A32D2D" stroke-width="1.2" marker-end="url(#arr-red)"/>
  <text x="418" y="918" text-anchor="middle" font-size="10" fill="#A32D2D">No</text>
  <rect x="240" y="908" width="148" height="32" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.7"/>
  <text x="314" y="928" text-anchor="middle" font-size="12" font-weight="600" fill="#791F1F">No interesado</text>

  <!-- Yes branch -->
  <line x1="505" y1="956" x2="505" y2="986" stroke="#3B6D11" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <text x="520" y="974" font-size="10" fill="#3B6D11">Sí</text>

  <!-- U5 Responde -->
  <rect x="380" y="988" width="250" height="52" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.7"/>
  <text x="505" y="1011" text-anchor="middle" font-size="13" font-weight="600" fill="#173404">Responde al vendedor</text>
  <text x="505" y="1029" text-anchor="middle" font-size="11" fill="#3B6D11">Elige propuesta o pide ajuste</text>

  <!-- feedback loop -->
  <path d="M380 1014 L175 1014 L175 582" fill="none" stroke="#639922" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arr-green)"/>
  <text x="268" y="1008" text-anchor="middle" font-size="10" fill="#3B6D11">respuesta del cliente</text>

  <!-- STATUS CYCLE -->
  <text x="175" y="1075" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1816">Ciclo de estado del lead</text>

  <rect x="40" y="1090" width="100" height="36" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.7"/>
  <text x="90" y="1112" text-anchor="middle" font-size="12" font-weight="600" fill="#444441">Nuevo</text>
  <line x1="140" y1="1108" x2="160" y2="1108" stroke="#888780" stroke-width="1.2" marker-end="url(#arr-gray)"/>

  <rect x="160" y="1090" width="120" height="36" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.7"/>
  <text x="220" y="1112" text-anchor="middle" font-size="12" font-weight="600" fill="#633806">Contactado</text>
  <line x1="280" y1="1108" x2="300" y2="1108" stroke="#BA7517" stroke-width="1.2"/>
  <line x1="300" y1="1108" x2="300" y2="1166" stroke="#0F6E56" stroke-width="1.2" marker-end="url(#arr-teal)"/>

  <rect x="40" y="1148" width="120" height="36" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.7"/>
  <text x="100" y="1170" text-anchor="middle" font-size="12" font-weight="600" fill="#085041">Interesado</text>
  <line x1="160" y1="1166" x2="178" y2="1166" stroke="#A32D2D" stroke-width="1.2" marker-end="url(#arr-red)"/>

  <rect x="178" y="1148" width="110" height="36" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.7"/>
  <text x="233" y="1170" text-anchor="middle" font-size="12" font-weight="600" fill="#791F1F">Cerrado ✓</text>

  <!-- LEGEND -->
  <rect x="30" y="1218" width="620" height="168" rx="10" fill="none" stroke="#D3D1C7" stroke-width="0.7"/>
  <text x="340" y="1242" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1816">Leyenda</text>

  <rect x="60" y="1256" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.7"/>
  <text x="82" y="1268" font-size="11" fill="#3C3489">Pantalla del administrador (vendedor)</text>

  <rect x="60" y="1280" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.7"/>
  <text x="82" y="1292" font-size="11" fill="#085041">Proceso de IA / URL pública</text>

  <rect x="60" y="1304" width="14" height="14" rx="3" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.7"/>
  <text x="82" y="1316" font-size="11" fill="#633806">Experiencia del usuario final (negocio)</text>

  <rect x="60" y="1328" width="14" height="14" rx="3" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.7"/>
  <text x="82" y="1340" font-size="11" fill="#173404">Conversión / cierre exitoso</text>

  <line x1="360" y1="1263" x2="400" y2="1263" stroke="#5F5E5A" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="410" y="1268" font-size="11" fill="#5F5E5A">Canal externo (WhatsApp / URL)</text>

  <line x1="360" y1="1291" x2="400" y2="1291" stroke="#5F5E5A" stroke-width="1.2"/>
  <text x="410" y="1296" font-size="11" fill="#5F5E5A">Navegación directa</text>

  <polygon points="400,1320 416,1312 416,1328" fill="none" stroke="#A32D2D" stroke-width="1"/>
  <text x="424" y="1324" font-size="11" fill="#A32D2D">Punto de decisión</text>
</svg>
